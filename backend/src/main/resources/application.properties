spring.application.name=boardgameshop

server.port=8080

# PostgreSQL via docker-compose (voir docker-compose.yml a la racine du depot) :
# `docker compose up -d` avant de demarrer le backend. Identifiants de dev uniquement.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/boardgameshop}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:boardgameshop}
spring.datasource.password=${DB_PASSWORD:boardgameshop}

# Le schema est desormais gere par des migrations versionnees (voir
# src/main/resources/db/migration) plutot que par l'auto-update Hibernate ;
# "validate" verifie juste que les entites JPA correspondent au schema applique.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT : valeur par defaut de dev ci-dessous (jamais utilisee telle quelle en prod),
# surchargeable via JWT_SECRET comme pour les cles Stripe ci-dessous.
jwt.secret=${JWT_SECRET:3LbpVPgukB5JBGwI63uF16ZrCMr7UkipwHr9hQkZugE=}
jwt.access-expiration-minutes=15
jwt.refresh-expiration-days=7

# Stripe (mode test) : cles lues depuis les variables d'environnement, jamais commitees.
# STRIPE_SECRET_KEY : cle secrete sk_test_... (Developpeurs > Cles API sur dashboard.stripe.com)
# STRIPE_WEBHOOK_SECRET : secret whsec_... fourni par `stripe listen` en dev (voir README)
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Logs : niveau applicatif plus verbeux que le reste (utile en dev), le reste au
# niveau par defaut de Spring Boot. Pas de SQL (trop bruyant) sauf activation ponctuelle.
logging.level.com.bgs.boardgameshop=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n
