spring.application.name=boardgameshop

server.port=8080

# Base H2 en memoire : pas d'installation necessaire, donnees reinitialisees a chaque demarrage
spring.datasource.url=jdbc:h2:mem:boardgameshop;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Console H2 accessible sur /h2-console (pratique en developpement)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
