spring.application.name=boardgameshop

server.port=8080

# Base H2 sur fichier local (backend/data/) : pas d'installation necessaire, et les comptes
# / commandes survivent aux redemarrages du backend pendant le developpement.
spring.datasource.url=jdbc:h2:file:./data/boardgameshop;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Console H2 accessible sur /h2-console (pratique en developpement)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT (valeur de dev uniquement, a ne jamais utiliser en production)
jwt.secret=3LbpVPgukB5JBGwI63uF16ZrCMr7UkipwHr9hQkZugE=
jwt.expiration-minutes=120

# Stripe (mode test) : cles lues depuis les variables d'environnement, jamais commitees.
# STRIPE_SECRET_KEY : cle secrete sk_test_... (Developpeurs > Cles API sur dashboard.stripe.com)
# STRIPE_WEBHOOK_SECRET : secret whsec_... fourni par `stripe listen` en dev (voir README)
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
