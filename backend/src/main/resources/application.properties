spring.application.name=boardgameshop

server.port=8080

# PostgreSQL via docker-compose (voir docker-compose.yml a la racine du depot) :
# `docker compose up -d` avant de demarrer le backend. Identifiants de dev uniquement.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/boardgameshop}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:boardgameshop}
spring.datasource.password=${DB_PASSWORD:boardgameshop}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT (valeur de dev uniquement, a ne jamais utiliser en production)
jwt.secret=3LbpVPgukB5JBGwI63uF16ZrCMr7UkipwHr9hQkZugE=
jwt.expiration-minutes=120

# Stripe (mode test) : cles lues depuis les variables d'environnement, jamais commitees.
# STRIPE_SECRET_KEY : cle secrete sk_test_... (Developpeurs > Cles API sur dashboard.stripe.com)
# STRIPE_WEBHOOK_SECRET : secret whsec_... fourni par `stripe listen` en dev (voir README)
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
