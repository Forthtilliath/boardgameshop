<section class="container auth">
  <div class="auth__card">
    <h1>Creer un compte</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth__form">
      <div class="auth__row">
        <label class="field">
          <span>Prenom</span>
          <input type="text" formControlName="firstName" autocomplete="given-name" />
        </label>

        <label class="field">
          <span>Nom</span>
          <input type="text" formControlName="lastName" autocomplete="family-name" />
        </label>
      </div>

      <label class="field">
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      <label class="field">
        <span>Mot de passe</span>
        <input type="password" formControlName="password" autocomplete="new-password" />
        <small>8 caracteres minimum</small>
      </label>

      @if (errorMessage(); as message) {
        <p class="auth__error">{{ message }}</p>
      }

      <button type="submit" class="btn btn--primary" [disabled]="submitting()">
        {{ submitting() ? 'Creation...' : 'Creer mon compte' }}
      </button>
    </form>

    <p class="auth__switch">
      Deja un compte ? <a routerLink="/connexion">Se connecter</a>
    </p>
  </div>
</section>
