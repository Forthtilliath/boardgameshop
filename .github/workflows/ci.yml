name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: boardgameshop
          POSTGRES_USER: boardgameshop
          POSTGRES_PASSWORD: boardgameshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boardgameshop -d boardgameshop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/boardgameshop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B -q test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        working-directory: frontend
        run: npx ng test --watch=false --browsers=ChromeHeadless
      - name: Build (browser + SSR)
        working-directory: frontend
        run: npx ng build
